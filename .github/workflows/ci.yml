name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  renderer:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.3.0
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-store
        run: echo "STORE_PATH=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit tests, builds, and packed consumer checks
        run: pnpm test

      - name: Install browser engines
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Browser and accessibility tests
        run: pnpm test:browser

      - name: Benchmark desktop fixture
        working-directory: renderer
        run: SEATMAP_BENCHMARK=1 pnpm exec playwright test performance.spec.js --project=chromium

      - name: Upload browser traces and benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: renderer-verification
          path: renderer/test-results
          if-no-files-found: ignore
